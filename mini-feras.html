<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mini Feras · Polaroid</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Barlow&#43;Condensed:wght@700;800;900&amp;display=swap" rel="stylesheet">

<style>
:root{
  --roxo:#5820da;
  --verde:#baff4c;
  --ciano:#10c5ed;
  --papel:#fffefa;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
body{
  position:relative;
  isolation:isolate;
  background:
    radial-gradient(ellipse at 50% 42%,#25263c 0,transparent 61%),
    repeating-linear-gradient(0deg,#8d92be0a 0 1px,transparent 1px 24px),
    repeating-linear-gradient(90deg,#8d92be0a 0 1px,transparent 1px 24px),
    #10111b;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
  font-family:Arial,sans-serif;
}
/* A sheet of contact prints around the portrait, at lower contrast than the paper. */
.desk-tile{
  position:absolute;
  z-index:-1;
  width:clamp(75px,15vmin,175px);
  aspect-ratio:1;
  transform:rotate(var(--angle));
  pointer-events:none;
  opacity:.49;
}
.desk-tile:nth-child(1){
  --angle:-12deg;
  left:clamp(-31px,7vw,105px);
  top:17%;
  background:radial-gradient(circle at 0 100%,#131723 0 28%,#5953a0 29% 59%,#235c61 60%);
}
.desk-tile:nth-child(2){
  --angle:11deg;
  right:clamp(-24px,8vw,120px);
  top:13%;
  background:radial-gradient(#9299bf 0 19%,transparent 22%) 0 0 / 20% 20%,#242748;
}
.desk-tile:nth-child(3){
  --angle:-9deg;
  right:clamp(-27px,6vw,95px);
  bottom:13%;
  background:conic-gradient(from 45deg,#474482 0 25%,#1b2237 0 50%,#2c6e74 0 75%,#1b2237 0) 0 0 / 50% 50%;
}
.desk-tile:nth-child(4){
  --angle:8deg;
  left:clamp(-29px,9vw,125px);
  bottom:10%;
  border-radius:49% 35% 67% 27%;
  background:#294b60;
}
.polaroid{
  position:relative;
  width:min(88vw,740px,calc(81dvh * .83));
  aspect-ratio:.83;
  flex:none;
  background:var(--papel);
  padding:clamp(10px,2vw,19px);
  display:flex;
  flex-direction:column;
  box-shadow:0 22px 75px #000b,5px 6px 0 #b4b5cb31,10px 12px 0 #0c0d16a0;
  transform:rotate(-.6deg);
  transition:transform .28s ease;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
  overflow:hidden;
}
.polaroid.next{transform:rotate(1deg)}
.photo{
  position:relative;
  width:100%;
  flex:1;
  min-height:0;
  background:#25232b;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}
.photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:none;
}
.photo img.visible{display:block}
.loading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  font:800 20px 'Barlow Condensed',sans-serif;
  letter-spacing:.08em;
  color:#eee;
}
.photo-label{
  height:clamp(78px,11vh,114px);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 7px 0;
  gap:15px;
}
.identidade{
  flex:1;
  min-width:0;
  text-align:center;
  padding-left:30px;
}
.nome{
  display:block;
  color:#211b2d;
  font:700 clamp(35px,6vw,61px)/.86 'Caveat',cursive;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.apelido{
  margin-top:5px;
  color:#77717c;
  font:700 clamp(14px,2vw,21px)/1 'Caveat',cursive;
}
.selo{
  position:relative;
  isolation:isolate;
  display:grid;
  place-content:center;
  justify-items:center;
  flex-shrink:0;
  width:clamp(53px,7vw,77px);
  aspect-ratio:1;
  border-radius:50%;
  border:2px solid #b5dbd9;
  color:#fffdf2;
  background:radial-gradient(ellipse at 28% 15%,#5a61a2,#29265b 54%,#191b35 82%);
  transform:rotate(11deg);
  box-shadow:0 0 0 1px #1b2434,0 3px 0 #182132,2px 5px 6px #1e1a3a55,inset 0 0 0 2px #1c203b;
  font:900 clamp(11px,1.8vw,18px)/.85 'Barlow Condensed',sans-serif;
  letter-spacing:.075em;
}
.selo::before{
  content:"";
  position:absolute;
  inset:5px;
  z-index:-1;
  border:1px dashed #b5dbd999;
  border-radius:50%;
}
.selo small{
  color:#9de1cb;
  font-size:1.36em;
  margin-top:4px;
}
.selo::after{
  content:"";
  position:absolute;
  width:26%;
  height:12%;
  top:11%;
  left:20%;
  border-top:2px solid #fff8;
  border-radius:50%;
  transform:rotate(-34deg);
}
.mini-controls{
  position:relative;
  z-index:1;
  display:flex;
  gap:8px;
}
.mini-controls[hidden]{display:none}
.mini-controls button{
  min-height:44px;
  padding:.45rem .85rem;
  border:1px solid #72809f;
  border-radius:4px;
  background:#202942;
  color:#eef0fb;
  font:800 1rem/1 'Barlow Condensed',Arial,sans-serif;
  cursor:pointer;
}
.mini-controls button:hover{background:#35466b}
.mini-controls button:focus-visible{outline:2px solid #9de1cb;outline-offset:2px}
@media(max-height:570px){
  .polaroid{width:min(88vw,740px,calc((100dvh - 106px) * .83))}
}
.counter{
  position:absolute;
  left:8px;
  bottom:5px;
  color:#a6a2ac;
  font:700 10px Arial,sans-serif;
  letter-spacing:.14em;
}
@media(max-height:530px){
 .photo-label{height:58px}
 .nome{font-size:30px}
 .apelido{font-size:12px}
 .selo{width:42px;height:42px;font-size:10px}
 .identidade{padding-left:15px}
}
@media(prefers-reduced-motion:reduce){.polaroid{transition:none}}

.mini-game{display:flex;gap:.5rem;z-index:1}
.mini-game[hidden],.mini-game button[hidden]{display:none}
.mini-game button{min-height:44px;padding:.45rem .9rem;border:1px solid #8acbba;border-radius:4px;background:#234762;color:white;cursor:pointer;font:800 1rem/1 'Barlow Condensed',Arial,sans-serif}
.mini-game button:focus-visible{outline:2px solid #cdf1d6;outline-offset:2px}
.polaroid{width:min(88vw,740px,calc((100dvh - 178px) * .83))}
</style>
</head>

<body>
<div class="desk-tile" aria-hidden="true"></div><div class="desk-tile" aria-hidden="true"></div>
<div class="desk-tile" aria-hidden="true"></div><div class="desk-tile" aria-hidden="true"></div>

<main class="polaroid" id="polaroid"
  aria-label="Galeria de fotos dos Feras 26">
  <div class="photo" id="photo">
    <div class="loading" id="loading" role="status">
      ABRINDO NOSSO ÁLBUM…
    </div>
    <img id="imagem" alt="Foto de infância">
  </div>

  <div class="photo-label">
    <div class="identidade">
      <span class="nome" id="nome"></span>
      <div class="apelido" id="apelido"></div>
    </div>

    <div class="selo" aria-label="Feras 26">
      FERAS
      <small>26</small>
    </div>

    <span class="counter" id="counter" aria-live="polite"></span>
  </div>
</main>
<div class="mini-game" hidden><button type="button" id="guessMode" aria-pressed="false">Tentar adivinhar</button><button type="button" id="revealName" hidden>Revelar nome</button></div>
<nav class="mini-controls" aria-label="Navegar pelas polaroids" hidden>
  <button type="button" id="miniPrev"><span aria-hidden="true">←</span> Anterior</button>
  <button type="button" id="miniNext">Próxima <span aria-hidden="true">→</span></button>
</nav>

<script>
"use strict";
const card = document.querySelector("#polaroid");
const picture = document.querySelector("#imagem");
const loading = document.querySelector("#loading");
const nome = document.querySelector("#nome");
const apelido = document.querySelector("#apelido");
const counter = document.querySelector("#counter");
const controls = document.querySelector(".mini-controls");
const guessMode = document.querySelector("#guessMode");
const revealName = document.querySelector("#revealName");
const game = document.querySelector(".mini-game");
let gallery = [];
let photos = [];
let guessing = false;

function shuffle(entries) {
  const order = [...entries];
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  return order;
}

function showAnswer() {
  const photo = photos[index];
  nome.textContent = photo.nome;
  apelido.textContent = photo.apelido || "";
  apelido.hidden = !photo.apelido;
  picture.alt = "Foto de infância de " + photo.nome;
  revealName.hidden = true;
}
guessMode.addEventListener("click", () => {
  guessing = !guessing;
  guessMode.setAttribute("aria-pressed", String(guessing));
  guessMode.textContent = guessing ? "Voltar ao álbum" : "Tentar adivinhar";
  photos = guessing ? shuffle(gallery) : gallery;
  index = 0;
  show();
});
revealName.addEventListener("click", () => {
  showAnswer();
  document.querySelector("#miniNext").focus();
});
let index = 0;
let gesture = null;
let touchedAt = 0;

function show() {
  const photo = photos[index];
  if (!photo) {
    loading.textContent = "AINDA NÃO TEMOS FOTOS";
    return;
  }
  if (guessing) {
    nome.textContent = "Quem é esse Fera?";
    apelido.textContent = "";
    apelido.hidden = true;
    picture.alt = "Foto de infância para adivinhar";
    revealName.hidden = false;
  } else {
    showAnswer();
  }
  counter.textContent = String(index + 1).padStart(2, "0") + " / " + String(photos.length).padStart(2, "0");
  card.classList.toggle("next", index % 2 === 1);
  loading.style.display = "flex";
  loading.textContent = "REVELANDO MEMÓRIA…";
  picture.classList.remove("visible");
  picture.onload = () => {
    if (photos[index] !== photo) return;
    picture.classList.add("visible");
    loading.style.display = "none";
    if (photos.length > 1) {
      new Image().src = photos[(index + 1) % photos.length].src;
      new Image().src = photos[(index + photos.length - 1) % photos.length].src;
    }
  };
  picture.onerror = () => {
    if (photos[index] === photo) loading.textContent = "NÃO FOI POSSÍVEL ABRIR ESTA FOTO";
  };
  picture.src = photo.src;
}
function move(direction) {
  if (photos.length < 2) return;
  index = (index + direction + photos.length) % photos.length;
  show();
}
document.querySelector("#miniPrev").addEventListener("click", () => move(-1));
document.querySelector("#miniNext").addEventListener("click", () => move(1));
card.addEventListener("touchstart", event => {
  const touch = event.changedTouches[0];
  gesture = { x: touch.screenX, y: touch.screenY };
}, { passive: true });
card.addEventListener("touchend", event => {
  if (!gesture) return;
  const touch = event.changedTouches[0];
  const dx = touch.screenX - gesture.x;
  const dy = touch.screenY - gesture.y;
  gesture = null;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
    touchedAt = Date.now();
    move(dx < 0 ? 1 : -1);
  }
}, { passive: true });
card.addEventListener("click", event => {
  if (Date.now() - touchedAt < 450) return;
  const rect = card.getBoundingClientRect();
  const x = (event.clientX - rect.left) / rect.width;
  if (x < .3) move(-1);
  if (x > .7) move(1);
});
document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") move(1);
  if (event.key === "ArrowLeft") move(-1);
  if (event.key === "Escape" && window.parent !== window) {
    window.parent.postMessage("feras:close-mini", "*");
  }
});
async function start() {
  try {
    const embedded = document.querySelector("#miniData");
    const rows = embedded ? JSON.parse(embedded.textContent) : await (await fetch("./content/mini-feras.json")).json();
    gallery = rows.filter(row => row.nome && (embedded ? /^data:image\/webp;base64,/.test(row.src) : /^\.\/media\/mini-feras\/[\w/-]+\.(webp|jpe?g|png)$/i.test(row.src)));
    photos = gallery;
    game.hidden = !photos.length;
    controls.hidden = photos.length < 2;
    show();
  } catch {
    loading.textContent = "NÃO FOI POSSÍVEL ABRIR O ÁLBUM";
  }
}
start();
</script>

</body>
</html>
