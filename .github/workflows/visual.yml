name: Visual smoke — FERAS 26
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "main.js"
      - "content/**"
      - "tests/**"
      - ".github/workflows/visual.yml"
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/feras-server.log 2>&1 &
      - name: Check desktop, iPad and iPhone
        run: node tests/visual-smoke.mjs
      - name: Store screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feras-visual-snapshots
          path: visual-snapshots/
          if-no-files-found: ignore
